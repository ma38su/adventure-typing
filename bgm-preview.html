<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ことば島 BGM Preview</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111827; color: #f8fafc; }
    main { width: min(420px, calc(100% - 40px)); text-align: center; padding: 40px 24px; border: 1px solid #334155; border-radius: 24px; background: #1e293b; box-shadow: 0 24px 70px #0008; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 28px; color: #94a3b8; }
    button { min-width: 150px; padding: 14px 24px; border: 0; border-radius: 999px; background: #38bdf8; color: #082f49; font: inherit; font-weight: 800; cursor: pointer; }
    button:hover { background: #7dd3fc; }
    #status { display: block; min-height: 1.5em; margin-top: 18px; color: #bae6fd; }
  </style>
</head>
<body>
  <main>
    <h1>ことば島 BGM</h1>
    <p>92 BPM・約21秒のループ試作</p>
    <button id="toggle" type="button">▶ 再生</button>
    <span id="status">停止中</span>
  </main>
  <script>
    const bpm = 92;
    const beat = 60 / bpm;
    const loopDuration = beat * 32;
    const harmony = [
      [50, 57, 64, 67], [46, 53, 60, 64], [53, 60, 64, 69], [48, 55, 62, 65],
      [50, 57, 64, 69], [55, 62, 65, 72], [46, 53, 60, 65], [45, 52, 57, 61],
    ];
    const melody = [74, 77, 76, 72, 69, 72, 74, 81, 79, 76, 77, 72, 74, 69, 73, 76];
    const midiToFrequency = note => 440 * 2 ** ((note - 69) / 12);
    const button = document.querySelector('#toggle');
    const status = document.querySelector('#status');
    let context = null;
    let timer = null;
    let playing = false;

    function playPhrase() {
      if (!context || context.state !== 'running') return;
      const phraseStart = context.currentTime + 0.06;
      const master = context.createGain();
      master.gain.setValueAtTime(0.48, phraseStart);
      master.connect(context.destination);

      function playNote(note, start, duration, volume, type, detune = 0) {
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(midiToFrequency(note), start);
        oscillator.detune.setValueAtTime(detune, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain).connect(master);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.02);
      }

      harmony.forEach((chord, bar) => {
        const barStart = phraseStart + bar * beat * 4;
        playNote(chord[0] - 12, barStart, beat * 3.7, 0.018, 'sine');
        [0, 2, 1, 3, 2, 1].forEach((voice, step) => {
          playNote(chord[voice], barStart + step * beat * 2 / 3, beat * 0.72, 0.014, 'triangle');
        });
        if (bar % 2 === 1) playNote(chord[3] + 12, barStart + beat * 3.25, beat * 0.6, 0.006, 'sine', 5);
      });

      melody.forEach((note, index) => {
        const start = phraseStart + index * beat * 2;
        const held = index % 4 === 3 ? beat * 1.65 : beat * 1.15;
        playNote(note, start, held, 0.012, 'sine');
        playNote(note + 12, start + 0.018, held * 0.72, 0.0035, 'triangle', -6);
      });
      window.setTimeout(() => master.disconnect(), (loopDuration + 0.5) * 1000);
    }

    button.addEventListener('click', async () => {
      if (playing) {
        clearInterval(timer);
        await context.close();
        context = null;
        playing = false;
        button.textContent = '▶ 再生';
        status.textContent = '停止中';
        return;
      }
      context = new AudioContext();
      await context.resume();
      playing = true;
      playPhrase();
      timer = setInterval(playPhrase, loopDuration * 1000);
      button.textContent = '■ 停止';
      status.textContent = '再生中…';
    });
  </script>
</body>
</html>
