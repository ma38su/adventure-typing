<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ことば島 全島terrain backbone v1</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#102a30;color:#fff;font-family:system-ui,"Hiragino Sans",sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:2;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:14px;padding:10px 14px;border:1px solid #ffffff55;border-radius:14px;background:#173b3bd9;backdrop-filter:blur(8px)}h1{margin:0;font-size:17px}.hud p{margin:3px 0 0;color:#d4e8df;font-size:11px}.legend{align-self:center;font-size:11px;line-height:1.7;text-align:right}.key{display:inline-block;width:13px;height:4px;margin:0 4px 2px 9px;border-radius:4px}.foot{position:fixed;z-index:2;left:14px;bottom:12px;padding:7px 10px;border-radius:10px;background:#102c2bd9;color:#d9eee6;font-size:10px}
  </style>
</head>
<body>
  <header class="hud"><div><h1>ことば島｜全島 low-detail terrain backbone</h1><p>海岸・旧カルデラ・分水嶺・水系・気候と、route-v2 全36 Stageを同じENU地表で確認</p></div><div class="legend"><span class="key" style="background:#ffe083"></span>Stage 1–12 <span class="key" style="background:#c8a7ff"></span>Stage 13–36<br><span class="key" style="background:#ff8a5c;height:7px"></span>Stage 1 detailed corridor範囲</div></header>
  <div class="foot">ドラッグ: 回転　ホイール: 拡大　青=海／緑=風上湿潤／黄緑=雨陰／灰青=高地</div>
  <script type="module">
    import * as THREE from 'three'
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js'
    import { createIslandTerrainGrid, createIslandCoastlinePolygon, sampleSurfaceHeightKm } from '/src/journey3d/islandTerrainSurface.ts'
    import { projectAnchorToEnu, WORLD_ROUTE_REGISTRY } from '/src/journey3d/worldTerrainBackbone.ts'

    const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement)
    const scene=new THREE.Scene();scene.background=new THREE.Color(0xa8d5dc);scene.fog=new THREE.Fog(0xa8d5dc,38,92)
    const camera=new THREE.PerspectiveCamera(38,1,.1,180);camera.position.set(17,22,25)
    const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2.1,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=19;controls.maxDistance=48;controls.minPolarAngle=.2;controls.maxPolarAngle=Math.PI*.485
    scene.add(new THREE.HemisphereLight(0xfff0c7,0x294b54,2.3));const sun=new THREE.DirectionalLight(0xffe4a3,3.4);sun.position.set(-12,25,16);scene.add(sun)
    const PLANET_RADIUS_KM=6371,curvature=(e,n)=>(e*e+n*n)/(2*PLANET_RADIUS_KM)
    const ocean=new THREE.Mesh(new THREE.SphereGeometry(PLANET_RADIUS_KM,160,80),new THREE.MeshToonMaterial({color:0x327f91,side:THREE.FrontSide}));ocean.position.y=-PLANET_RADIUS_KM;scene.add(ocean)
    const grid=createIslandTerrainGrid(81,81,4),positions=[],colors=[],indices=[],C=grid.columns,R=grid.rows
    const coastal={"deep-ocean":0x327f91,"outer-reef":0x3fa9ac,"shallow-water":0x68c2b3,"estuary-wetland":0x718f62,"sand-shore":0xd5c783,"rock-shore":0x777b67}
    const tone=s=>s.coastalZoneId!=='inland'?new THREE.Color(coastal[s.coastalZoneId]):s.heightKm>.58?new THREE.Color(0x647a69):s.climateZoneId==='windward-wet'?new THREE.Color(0x3f7651):s.climateZoneId==='leeward-rainshadow'?new THREE.Color(0x9aa35c):new THREE.Color(0x688e58)
    grid.vertices.forEach(s=>{const surface=s.land?s.heightKm*7:s.bathymetryKm*.18;positions.push(s.eastKm,surface-curvature(s.eastKm,s.northKm),-s.northKm);const c=tone(s);colors.push(c.r,c.g,c.b)})
    for(let r=0;r<R-1;r++)for(let c=0;c<C-1;c++){const a=r*C+c,b=a+1,d=(r+1)*C+c,e=d+1;if([a,b,d,e].some(i=>grid.vertices[i].coastalZoneId!=='deep-ocean'))indices.push(a,d,b,b,d,e)}
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.setIndex(indices);geo.computeVertexNormals();const land=new THREE.Mesh(geo,new THREE.MeshToonMaterial({vertexColors:true,side:THREE.DoubleSide}));scene.add(land)
    const coast=createIslandCoastlinePolygon(128).map(p=>{const e=projectAnchorToEnu({...p,altitudeKm:0});return new THREE.Vector3(e.eastKm,.03-curvature(e.eastKm,e.northKm),-e.northKm)});coast.push(coast[0]);scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(coast),new THREE.LineBasicMaterial({color:0xfff0bc})))
    WORLD_ROUTE_REGISTRY.forEach(stage=>{const points=stage.anchors.map(a=>{const e=projectAnchorToEnu(a),ground=sampleSurfaceHeightKm(a.latitudeDeg,a.longitudeDeg),isSky=a.altitudeKm>1.25;return new THREE.Vector3(e.eastKm,(isSky?a.altitudeKm:ground)*7+.08-curvature(e.eastKm,e.northKm),-e.northKm)});scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color:stage.stage<=12?0xffe083:0xc8a7ff,transparent:true,opacity:stage.stage<=12?.92:.52})))})
    const stageOne=WORLD_ROUTE_REGISTRY[0].anchors.map(a=>{const e=projectAnchorToEnu(a);return new THREE.Vector3(e.eastKm,sampleSurfaceHeightKm(a.latitudeDeg,a.longitudeDeg)*7+.14-curvature(e.eastKm,e.northKm),-e.northKm)});const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(stageOne),80,.13,7,false),new THREE.MeshToonMaterial({color:0xff7855}));scene.add(tube)
    const resize=()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()};addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)})
  </script>
</body>
</html>
