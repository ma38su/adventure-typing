<body><main class="shell">
<section class="viewport" id="viewport" aria-label="女の子冒険者の3Dモーション確認"><div class="hud"><span>Girl adventurer / hierarchical rig v2</span><strong id="label">WALK・3/4</strong></div><output class="status" id="status"></output></section>
<section class="controls" aria-label="モーション確認操作">
 <div class="group"><span>MOTION</span><button data-motion="idle">idle</button><button data-motion="walk" class="active">walk</button><button data-motion="run">run</button><button id="play">停止</button></div>
 <div class="group"><span>CAMERA</span><button data-view="front">正面</button><button data-view="side">側面</button><button data-view="back">背面</button><button data-view="quarter" class="active">3/4</button></div>
 <div class="group"><span>INSPECT</span><label><input id="wire" type="checkbox"> wire</label><label><input id="bones" type="checkbox"> 骨格</label><label><input id="reduced" type="checkbox"> reduced motion</label></div>
 <div class="group"><span>SPEED <output id="speedOut">1.00×</output></span><input class="speed" id="speed" type="range" min="0.5" max="1.5" value="1" step="0.05"></div>
</section>
<p class="note">華やか版v2三面図をもとにした造形・動作プリビズです。ターコイズの上着、コーラルの差し色、黄土サッシュ、葉形肩布、斜め掛け鞄を含みます。GLB量産前にシルエットと foot plant を確認するための Three.js 階層リグです。</p>
</main><script type="module">

const ground=new THREE.Mesh(new THREE.CircleGeometry(7,64).rotateX(-Math.PI/2),new THREE.MeshToonMaterial({color:0x8eb488}));ground.receiveShadow=true;scene.add(ground);const rings=new THREE.GridHelper(12,24,0xffffff,0xffffff);rings.material.opacity=.14;rings.material.transparent=true;scene.add(rings);
const mats={skin:new THREE.MeshToonMaterial({color:0xf1bc91}),hair:new THREE.MeshToonMaterial({color:0x49352f}),teal:new THREE.MeshToonMaterial({color:0x168e8c}),tealDark:new THREE.MeshToonMaterial({color:0x176866}),cream:new THREE.MeshToonMaterial({color:0xf4e6c4}),coral:new THREE.MeshToonMaterial({color:0xe76f61}),ochre:new THREE.MeshToonMaterial({color:0xd4a63c}),leather:new THREE.MeshToonMaterial({color:0x855940}),shoe:new THREE.MeshToonMaterial({color:0x354c48})};

const root=new THREE.Group();root.name='root';scene.add(root);const hips=joint(root,'hips',[0,1.48,0]);part(hips,new THREE.SphereGeometry(.29,12,8),mats.ochre);const pelvis=part(hips,new THREE.CapsuleGeometry(.3,.22,5,10),mats.tealDark,[0,.08,0],[0,0,Math.PI/2]);

const clav=[],upperArm=[],foreArm=[];for(const s of [-1,1]){const c=joint(chest,`clavicle_${s<0?'L':'R'}`,[s*.28,.22,0]);clav.push(c);const u=joint(c,`upperArm_${s<0?'L':'R'}`,[s*.09,0,0]);upperArm.push(u);part(u,capsule(.085,.37),mats.teal,[0,-.25,0]);const f=joint(u,`foreArm_${s<0?'L':'R'}`,[0,-.49,0]);foreArm.push(f);part(f,capsule(.075,.33),mats.skin,[0,-.225,0]);part(f,new THREE.SphereGeometry(.09,9,7),mats.skin,[0,-.45,0]);}

const thigh=[],shin=[],foot=[];for(const s of [-1,1]){const t=joint(hips,`upperLeg_${s<0?'L':'R'}`,[s*.19,-.04,0]);thigh.push(t);part(t,capsule(.13,.5),mats.cream,[0,-.32,0]);const k=joint(t,`lowerLeg_${s<0?'L':'R'}`,[0,-.66,0]);shin.push(k);part(k,capsule(.105,.48),mats.tealDark,[0,-.3,0]);const a=joint(k,`foot_${s<0?'L':'R'}`,[0,-.62,0]);foot.push(a);part(a,new THREE.BoxGeometry(.22,.16,.43,3,2,4),mats.shoe,[0,-.04,.11]);}
const bagPivot=joint(chest,'bag',[.34,.05,-.14]);part(bagPivot,new THREE.BoxGeometry(.43,.48,.18,4,4,2),mats.leather,[.11,-.37,-.05],[0,0,-.08]);part(bagPivot,new THREE.TorusGeometry(.43,.025,5,18,Math.PI),mats.ochre,[-.21,.17,.05],[0,1.57,-.72]);

document.querySelectorAll('[data-motion]').forEach(b=>b.onclick=()=>{motion=b.dataset.motion;document.querySelectorAll('[data-motion]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b))});$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'停止':'再生'};$('speed').oninput=e=>{speed=+e.target.value;$('speedOut').textContent=speed.toFixed(2)+'×'};$('wire').onchange=e=>meshes.forEach(m=>m.material.wireframe=e.target.checked);$('bones').onchange=e=>skeleton.visible=e.target.checked;
