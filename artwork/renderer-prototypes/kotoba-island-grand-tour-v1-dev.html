    const play=document.querySelector('#play'),view=document.querySelector('#view'),resetView=document.querySelector('#resetView'),slider=document.querySelector('#progress'),nameEl=document.querySelector('#placeName'),descEl=document.querySelector('#placeDescription'),stopsEl=document.querySelector('#stops')
    let playing=true,overview=false,progress=0,last=performance.now(),activeIndex=-1
    let followYaw=0,followCameraPitch=.38,followLookPitch=.10,followDistance=.85,dragging=false,dragX=0,dragY=0
    const renderedProgressForStop=stop=>{let nearest=0,best=Infinity;routePoints.forEach((point,index)=>{const distance=(point.x-stop.eastKm)**2+(-point.z-stop.northKm)**2;if(distance<best){best=distance;nearest=index}});return nearest/routePoints.length}
    ISLAND_GRAND_TOUR_STOPS.forEach(stop=>{const b=document.createElement('button');b.textContent=stop.name;b.onclick=()=>{progress=renderedProgressForStop(stop);slider.value=progress;playing=false;play.textContent='再生';play.setAttribute('aria-pressed','false');update(true)};stopsEl.appendChild(b)})
    play.onclick=()=>{playing=!playing;play.textContent=playing?'一時停止':'再生';play.setAttribute('aria-pressed',String(playing))}
    view.onclick=()=>{overview=!overview;view.textContent=overview?'追従に戻る':'全島を見る';view.setAttribute('aria-pressed',String(overview));controls.enabled=overview;scene.fog.far=overview?72:30;if(overview){camera.position.set(17,21,25);controls.target.set(0,1.8,0)}else update(true)}
    resetView.onclick=()=>{followYaw=0;followCameraPitch=.38;followLookPitch=.10;followDistance=.85;if(overview){camera.position.set(17,21,25);controls.target.set(0,1.8,0);controls.update()}else update(true)}
    slider.oninput=()=>{progress=Number(slider.value);playing=false;play.textContent='再生';play.setAttribute('aria-pressed','false');update(true)}
    renderer.domElement.addEventListener('pointerdown',event=>{if(overview)return;dragging=true;dragX=event.clientX;dragY=event.clientY;renderer.domElement.setPointerCapture(event.pointerId);renderer.domElement.style.cursor='grabbing'})
    renderer.domElement.addEventListener('pointermove',event=>{if(!dragging||overview)return;followYaw-= (event.clientX-dragX)*.006;followLookPitch=Math.max(-.55,Math.min(.90,followLookPitch-(event.clientY-dragY)*.005));dragX=event.clientX;dragY=event.clientY})
    const stopDrag=event=>{if(!dragging)return;dragging=false;renderer.domElement.releasePointerCapture?.(event.pointerId);renderer.domElement.style.cursor='grab'}
    renderer.domElement.addEventListener('pointerup',stopDrag);renderer.domElement.addEventListener('pointercancel',stopDrag);renderer.domElement.style.cursor='grab'
    renderer.domElement.addEventListener('wheel',event=>{if(overview)return;event.preventDefault();followDistance=Math.max(.48,Math.min(1.8,followDistance+event.deltaY*.001))},{passive:false})
    const stopProgress=ISLAND_GRAND_TOUR_STOPS.map(renderedProgressForStop);const circularDistance=(a,b)=>Math.min(Math.abs(a-b),1-Math.abs(a-b)),beachProgress=renderedProgressForStop(ISLAND_GRAND_TOUR_STOPS.find(stop=>stop.id==='beach'))
    const update=(jump=false)=>{const p=route.getPoint(progress),ahead=route.getPoint((progress+.008)%1),tangent=ahead.clone().sub(p).normalize();marker.position.copy(p).add(new THREE.Vector3(0,.08,0));let sightline=null;if(!overview){const forward=new THREE.Vector3(tangent.x,0,tangent.z).normalize(),nearBeach=circularDistance(progress,beachProgress)<.038,cameraPitch=nearBeach?.28:followCameraPitch,lookPitch=nearBeach?.15:followLookPitch;const orbit=new THREE.Vector3(-forward.x,0,-forward.z).applyAxisAngle(new THREE.Vector3(0,1,0),followYaw);const horizontal=followDistance*Math.cos(cameraPitch),vertical=.16+followDistance*Math.sin(cameraPitch);const desired=p.clone().addScaledVector(orbit,horizontal).add(new THREE.Vector3(0,vertical,0));camera.position.lerp(desired,jump?1:.045);const lookHeight=.08+Math.tan(lookPitch)*.62;const target=p.clone().addScaledVector(forward,.62).add(new THREE.Vector3(0,lookHeight,0));camera.lookAt(target);sightline={from:camera.position,to:target}}updateCanopyFade(broadleafTrunks,broadleaf,sightline);updateCanopyFade(broadleafCrowns,broadleaf,sightline);updateCanopyFade(cloudTrunks,cloudTrees,sightline);updateCanopyFade(cloudCrowns,cloudTrees,sightline);const idx=stopProgress.reduce((best,value,index)=>circularDistance(progress,value)<circularDistance(progress,stopProgress[best])?index:best,0);if(idx!==activeIndex){activeIndex=idx;const stop=ISLAND_GRAND_TOUR_STOPS[idx];nameEl.textContent=stop.name;descEl.textContent=stop.description;[...stopsEl.children].forEach((b,i)=>b.classList.toggle('active',i===idx))}}
    const resize=()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()};addEventListener('resize',resize);resize();update(true)
    renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;waveTexture.offset.x=(waveTexture.offset.x+dt*.003)%1;waveTexture.offset.y=(waveTexture.offset.y+dt*.0012)%1;foamMaterials.forEach((material,index)=>material.opacity=.56+Math.sin(now*.0016-index*1.8)*.14-index*.07);if(playing){progress=(progress+dt*.012)%1;slider.value=progress}update();if(overview)controls.update();renderer.render(scene,camera)})
