    renderer.domElement.addEventListener('wheel',event=>{if(overview)return;event.preventDefault();followDistance=Math.max(.48,Math.min(1.8,followDistance+event.deltaY*.001))},{passive:false})
    const stopProgress=ISLAND_GRAND_TOUR_STOPS.map(stop=>tourProgressForStop(stop.id));const circularDistance=(a,b)=>Math.min(Math.abs(a-b),1-Math.abs(a-b))
    const update=(jump=false)=>{const p=route.getPoint(progress),ahead=route.getPoint((progress+.008)%1),tangent=ahead.clone().sub(p).normalize();marker.position.copy(p).add(new THREE.Vector3(0,.08,0));let sightline=null;if(!overview){const forward=new THREE.Vector3(tangent.x,0,tangent.z).normalize();const orbit=new THREE.Vector3(-forward.x,0,-forward.z).applyAxisAngle(new THREE.Vector3(0,1,0),followYaw);const horizontal=followDistance*Math.cos(followCameraPitch),vertical=.20+followDistance*Math.sin(followCameraPitch);const desired=p.clone().addScaledVector(orbit,horizontal).add(new THREE.Vector3(0,vertical,0));camera.position.lerp(desired,jump?1:.045);const lookHeight=.08+Math.tan(followLookPitch)*.62;const target=p.clone().addScaledVector(forward,.56).add(new THREE.Vector3(0,lookHeight,0));camera.lookAt(target);sightline={from:camera.position,to:target}}updateCanopyFade(broadleafTrunks,broadleaf,sightline);updateCanopyFade(broadleafCrowns,broadleaf,sightline);updateCanopyFade(cloudTrunks,cloudTrees,sightline);updateCanopyFade(cloudCrowns,cloudTrees,sightline);const idx=stopProgress.reduce((best,value,index)=>circularDistance(progress,value)<circularDistance(progress,stopProgress[best])?index:best,0);if(idx!==activeIndex){activeIndex=idx;const stop=ISLAND_GRAND_TOUR_STOPS[idx];nameEl.textContent=stop.name;descEl.textContent=stop.description;[...stopsEl.children].forEach((b,i)=>b.classList.toggle('active',i===idx))}}
    const resize=()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()};addEventListener('resize',resize);resize();update(true)
    renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;waveTexture.offset.x=(waveTexture.offset.x+dt*.003)%1;waveTexture.offset.y=(waveTexture.offset.y+dt*.0012)%1;if(playing){progress=(progress+dt*.012)%1;slider.value=progress}update();if(overview)controls.update();renderer.render(scene,camera)})
  </script>
