<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ことば島・日本画水彩レンダラー試作</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8efe9;color:#27423d;font-family:ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif}body{padding:18px}.demo{width:min(1180px,100%);margin:auto}.viewport{position:relative;overflow:hidden;min-height:460px;aspect-ratio:2.2/1;border:1px solid rgba(74,101,83,.2);border-radius:24px;background:#b9d9ca;box-shadow:0 22px 60px rgba(49,73,61,.2)}canvas{display:block;width:100%;height:100%}.paper{position:absolute;z-index:2;inset:0;pointer-events:none;opacity:.24;mix-blend-mode:soft-light;background:repeating-linear-gradient(8deg,rgba(255,255,255,.2) 0 1px,transparent 1px 4px),repeating-linear-gradient(94deg,rgba(38,64,47,.08) 0 1px,transparent 1px 7px)}.wash{position:absolute;z-index:3;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,248,218,.08),transparent 52%,rgba(38,66,53,.15));box-shadow:inset 0 0 65px rgba(53,77,59,.22)}.hud{position:absolute;z-index:5;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(39,72,62,.56);color:white;font-size:12px;backdrop-filter:blur(7px)}.caption{position:absolute;z-index:5;left:50%;top:23%;transform:translateX(-50%);padding:7px 12px;border:1px solid rgba(255,255,255,.7);border-radius:10px;background:rgba(255,253,241,.82);color:#406056;font-size:11px;font-weight:700;white-space:nowrap}.walker{position:absolute;z-index:6;left:50%;bottom:-42px;width:250px;height:105px;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 6px 7px rgba(36,58,47,.2))}.walker .arm{position:absolute;bottom:0;width:72px;height:93px;border:5px solid rgba(255,250,228,.58);border-radius:52% 52% 24px 24px;background:linear-gradient(100deg,#347e72,#76ad96);transform-origin:50% 100%}.walker .arm:after{content:'';position:absolute;left:12px;right:12px;top:-19px;height:33px;border-radius:50%;background:#eac299}.walker .left{left:0;transform:rotate(17deg)}.walker .right{right:0;transform:rotate(-17deg)}.walker .pack{position:absolute;left:50%;bottom:26px;width:79px;height:52px;transform:translateX(-50%);border:4px solid rgba(92,65,43,.65);border-radius:20px 20px 8px 8px;background:#a9794f;box-shadow:inset 0 9px rgba(244,193,110,.32)}.walker .pack:after{content:'';position:absolute;left:18px;right:18px;bottom:7px;height:11px;border-top:3px solid rgba(92,65,43,.55);border-radius:8px}.step-pulse{position:absolute;z-index:4;left:50%;bottom:2%;width:45%;height:18%;transform:translateX(-50%);border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(ellipse,rgba(255,241,185,.12),transparent 67%)}.demo.playing .walker{animation:walk-body .52s ease-in-out infinite alternate}.demo.playing .walker .left{animation:walk-left 1.04s ease-in-out infinite}.demo.playing .walker .right{animation:walk-right 1.04s ease-in-out infinite}.demo.playing .step-pulse{animation:step-pulse .52s ease-out infinite}@keyframes walk-body{to{transform:translateX(-50%) translateY(5px) rotate(.35deg)}}@keyframes walk-left{0%,100%{transform:rotate(20deg) translateY(2px)}50%{transform:rotate(12deg) translateY(-5px)}}@keyframes walk-right{0%,100%{transform:rotate(-12deg) translateY(-5px)}50%{transform:rotate(-20deg) translateY(2px)}}@keyframes step-pulse{0%{opacity:.75;transform:translateX(-50%) scale(.78)}100%{opacity:0;transform:translateX(-50%) scale(1.25)}}.controls{display:grid;grid-template-columns:auto repeat(4,minmax(120px,1fr));gap:10px;margin-top:13px;padding:13px;border:1px solid #c6d6cc;border-radius:16px;background:rgba(255,255,255,.68)}button{min-height:43px;padding:0 17px;border:0;border-radius:10px;background:#317e70;color:white;font-weight:800;cursor:pointer}label{display:grid;gap:5px;color:#5b7169;font-size:10px;font-weight:700}input{width:100%;accent-color:#4a8c78}.note{margin:9px 3px 0;color:#697c75;font-size:11px;line-height:1.7}.error{position:absolute;z-index:10;inset:0;display:none;place-items:center;padding:30px;background:#edf4ef;color:#8b4c45;text-align:center}.error.show{display:grid}@media(max-width:760px){body{padding:8px}.viewport{min-height:400px;aspect-ratio:auto}.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:1/-1}.hud{font-size:10px}.caption{font-size:9px}.walker{transform:translateX(-50%) scale(.82);transform-origin:50% 100%}}@media(prefers-reduced-motion:reduce){.paper{opacity:.18}.demo.playing .walker,.demo.playing .walker .arm,.demo.playing .step-pulse{animation:none}}
  </style>
</head>
<body>
  <main class="demo playing" id="demo">
    <section class="viewport" id="viewport" aria-label="水彩ファンタジー調の獣道の森レンダリング試作">
      <div class="paper" id="paper"></div><div class="wash"></div>
      <div class="hud"><span>✦ ことばで進む道・描画試作</span><strong>木漏れ日の森　<span id="percent">14%</span></strong></div>
      <div class="caption">やわらかな光の向こうに、小川へ続く道が見える</div>
      <div class="step-pulse" aria-hidden="true"></div>
      <div class="walker" aria-hidden="true"><span class="arm left"></span><span class="arm right"></span><span class="pack"></span></div>
      <div class="error" id="error">3Dライブラリを読み込めませんでした。ネット接続を確認してください。</div>
    </section>
    <div class="controls">
      <button id="toggle" type="button">一時停止</button>
      <label>旅の位置 <output id="progress-output">14%</output><input id="progress" type="range" min="0" max="1000" value="140"></label>
      <label>水彩の淡さ <output id="wash-output">68%</output><input id="wash" type="range" min="0" max="100" value="68"></label>
      <label>紙の質感 <output id="paper-output">24%</output><input id="paper-range" type="range" min="0" max="55" value="24"></label>
      <label>光のにじみ <output id="light-output">55%</output><input id="light" type="range" min="0" max="100" value="55"></label>
    </div>
    <p class="note">比較対象は写実ではなく、形は3Dで読みやすく、色面と光は手描きの児童書に寄せる方向です。黒い輪郭線は使わず、近景の濃さ・遠景の色抜け・紙目・半透明の光で奥行きを作っています。</p>
  </main>
  <script type="module">
    const error=document.getElementById('error')
    try{
      const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js')
      const viewport=document.getElementById('viewport'),demo=document.getElementById('demo'),paper=document.getElementById('paper')
      const progress=document.getElementById('progress'),wash=document.getElementById('wash'),paperRange=document.getElementById('paper-range'),light=document.getElementById('light')
      const scene=new THREE.Scene();scene.background=new THREE.Color(0xb9d9ca);scene.fog=new THREE.Fog(0xbacdb9,13,53)
      const camera=new THREE.PerspectiveCamera(55,2.2,.1,140);camera.position.set(0,1.55,5)
      const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.03;renderer.shadowMap.enabled=false;viewport.prepend(renderer.domElement)
      const hemi=new THREE.HemisphereLight(0xfff3cf,0x365c4b,2.1);scene.add(hemi)
      const sun=new THREE.DirectionalLight(0xffe9b8,2.5);sun.position.set(-8,13,5);sun.castShadow=true;sun.shadow.mapSize.set(512,512);Object.assign(sun.shadow.camera,{left:-15,right:15,top:15,bottom:-15});scene.add(sun)
      function randomSource(seed){let state=seed>>>0;return()=>{state=(state*1664525+1013904223)>>>0;return state/4294967296}}
      function painted(base,colors,seed){const canvas=document.createElement('canvas');canvas.width=canvas.height=256;const c=canvas.getContext('2d'),random=randomSource(seed);c.fillStyle=base;c.fillRect(0,0,256,256);colors.forEach((color,layer)=>{c.strokeStyle=color;c.globalAlpha=.13+layer*.06;c.lineCap='round';for(let i=0;i<270;i++){const x=random()*256,y=random()*256,length=3+random()*19;c.lineWidth=1+random()*4;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+(random()-.5)*length,y+length*.4,x+(random()-.5)*length,y+length);c.stroke()}});c.globalAlpha=1;const texture=new THREE.CanvasTexture(canvas);texture.wrapS=texture.wrapT=THREE.RepeatWrapping;texture.colorSpace=THREE.SRGBColorSpace;texture.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());return texture}
      function foliage(seed,far=false){const canvas=document.createElement('canvas');canvas.width=canvas.height=512;const c=canvas.getContext('2d'),random=randomSource(seed),colors=far?['#718f72','#8fab83','#afc49a']:['#416d4d','#638e56','#89aa69','#b4c77c'];c.clearRect(0,0,512,512);for(let layer=0;layer<colors.length;layer++){c.fillStyle=colors[layer];for(let i=0;i<(far?38:56);i++){const angle=random()*Math.PI*2,radius=random()*(far?145:170),x=256+Math.cos(angle)*radius,y=270+Math.sin(angle)*radius*.58,w=48+random()*105,h=30+random()*72;c.globalAlpha=.12+layer*.075;c.beginPath();c.ellipse(x,y,w,h,random()*.5,0,Math.PI*2);c.fill()}}c.globalCompositeOperation='destination-out';c.globalAlpha=.16;for(let i=0;i<24;i++){c.beginPath();c.ellipse(110+random()*300,115+random()*270,8+random()*30,5+random()*18,random(),0,Math.PI*2);c.fill()}c.globalCompositeOperation='source-over';c.globalAlpha=1;const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;return texture}
      function grassPaint(seed){const canvas=document.createElement('canvas');canvas.width=256;canvas.height=512;const c=canvas.getContext('2d'),random=randomSource(seed);c.clearRect(0,0,256,512);for(let i=0;i<70;i++){c.strokeStyle=i%3?'#4f7d50':'#84a969';c.globalAlpha=.25+random()*.42;c.lineWidth=2+random()*6;c.beginPath();const x=30+random()*196;c.moveTo(x,500);c.quadraticCurveTo(x+(random()-.5)*45,350-random()*100,x+(random()-.5)*65,130+random()*210);c.stroke()}c.globalAlpha=1;const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;return texture}
      function terrainPaint(seed){const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=2048;const c=canvas.getContext('2d'),random=randomSource(seed);c.fillStyle='#53784d';c.fillRect(0,0,1024,2048);for(let layer=0;layer<170;layer++){const colors=['#345f46','#75935a','#91a967','#b1b476','#425f48'],x=random()*1024,y=random()*2048,w=90+random()*380,h=45+random()*220;c.globalAlpha=.025+random()*.065;c.fillStyle=colors[layer%colors.length];c.beginPath();c.ellipse(x,y,w,h,random()*.45,0,Math.PI*2);c.fill()}c.globalAlpha=.86;c.lineCap='round';c.lineJoin='round';const route=new Path2D();route.moveTo(505,2110);route.bezierCurveTo(650,1660,390,1320,525,1000);route.bezierCurveTo(650,690,430,430,518,-80);c.strokeStyle='#796d4d';c.lineWidth=155;c.stroke(route);c.globalAlpha=.7;c.strokeStyle='#b69a67';c.lineWidth=124;c.stroke(route);c.globalAlpha=.52;c.strokeStyle='#d3b77d';c.lineWidth=82;c.stroke(route);for(let i=0;i<620;i++){const y=random()*2048,center=512+Math.sin(y*.0105)*45+Math.sin(y*.0031)*36,width=45+random()*80,x=center+(random()-.5)*width;c.globalAlpha=.08+random()*.23;c.fillStyle=i%4?'#6d5b43':'#ead090';c.beginPath();c.ellipse(x,y,3+random()*15,2+random()*7,random()*.5,0,Math.PI*2);c.fill()}for(let i=0;i<840;i++){const y=random()*2048,center=512+Math.sin(y*.0105)*45+Math.sin(y*.0031)*36,side=random()<.5?-1:1,x=center+side*(75+random()*420),colors=['#92774e','#5e6944','#b49a60','#394f3d'];c.globalAlpha=.1+random()*.28;c.fillStyle=colors[i%colors.length];c.save();c.translate(x,y);c.rotate(random()*Math.PI);c.beginPath();c.ellipse(0,0,2+random()*11,1+random()*4,0,0,Math.PI*2);c.fill();c.restore()}c.globalAlpha=.12;c.fillStyle='#fff1b4';for(let i=0;i<85;i++){c.beginPath();c.ellipse(random()*1024,random()*2048,18+random()*75,5+random()*28,random(),0,Math.PI*2);c.fill()}c.globalAlpha=1;const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return texture}
      const textures={terrain:terrainPaint(61),bark:painted('#72573d',['#342f29','#c19a66','#526b48'],131),leaf:painted('#688f5b',['#a6bd76','#345f4a','#d2cd83'],151)};textures.bark.repeat.set(2,6);textures.leaf.repeat.set(3,3)
      const gradient=new THREE.DataTexture(new Uint8Array([82,145,205,255]),4,1,THREE.RedFormat);gradient.minFilter=gradient.magFilter=THREE.NearestFilter;gradient.needsUpdate=true
      const crownMaps=[foliage(151),foliage(177),foliage(199)],farCrown=foliage(241,true),grassMap=grassPaint(301)
      const mats={terrain:new THREE.MeshBasicMaterial({map:textures.terrain,color:0xe6e1c8}),bark:new THREE.MeshToonMaterial({map:textures.bark,gradientMap:gradient}),rock:new THREE.MeshToonMaterial({color:0x6c806a,gradientMap:gradient}),moss:new THREE.MeshBasicMaterial({color:0x718a50}),grass:new THREE.MeshBasicMaterial({map:grassMap,transparent:true,alphaTest:.025,depthWrite:false,side:THREE.DoubleSide}),root:new THREE.MeshToonMaterial({map:textures.bark,color:0x988162,gradientMap:gradient})}
      function terrainHeight(x,z){const side=Math.max(0,Math.abs(x)-1.25);return Math.sin(z*.095+x*.31)*.075+Math.sin(z*.031-x*.23)*.11+Math.min(.5,side*side*.018)}
      const terrainGeo=new THREE.PlaneGeometry(52,125,72,180),terrainPos=terrainGeo.attributes.position;for(let i=0;i<terrainPos.count;i++){const x=terrainPos.getX(i),localY=terrainPos.getY(i),worldZ=-localY-54;terrainPos.setZ(i,terrainHeight(x,worldZ))}terrainGeo.computeVertexNormals();const terrain=new THREE.Mesh(terrainGeo,mats.terrain);terrain.rotation.x=-Math.PI/2;terrain.position.set(0,0,-54);scene.add(terrain)
      const swaying=[],random=randomSource(2048),crownGeo=new THREE.PlaneGeometry(5.2,3.7),farGeo=new THREE.PlaneGeometry(25,11),grassGeo=new THREE.PlaneGeometry(1.5,2.25),rockGeo=new THREE.DodecahedronGeometry(.45,0)
      for(let row=0;row<7;row++){const material=new THREE.MeshBasicMaterial({map:farCrown,transparent:true,depthWrite:false,color:new THREE.Color().setHSL(.3,.16,.62+row*.015),side:THREE.DoubleSide}),left=new THREE.Mesh(farGeo,material),right=new THREE.Mesh(farGeo,material);left.position.set(-10,4.2,-23-row*15);right.position.set(10,4.2,-30-row*15);scene.add(left,right)}
      function branch(parent,a,b,r1,r2){const direction=new THREE.Vector3().subVectors(b,a),geometry=new THREE.CylinderGeometry(r2,r1,direction.length(),7),mesh=new THREE.Mesh(geometry,mats.bark);mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());parent.add(mesh)}
      for(let row=0;row<16;row++){const z=-7-row*6.2;for(const side of[-1,1]){const group=new THREE.Group(),distance=2.1+random()*5.4,height=5.8+random()*2.3,bend=side*(.18+random()*.48);group.position.set(side*distance,terrainHeight(side*distance,z),z-random()*3.8);group.scale.setScalar(.72+random()*.42);const p0=new THREE.Vector3(0,0,0),p1=new THREE.Vector3(bend*.25,height*.33,(random()-.5)*.14),p2=new THREE.Vector3(bend,height*.68,(random()-.5)*.25),p3=new THREE.Vector3(bend*.55,height,0);branch(group,p0,p1,.38,.29);branch(group,p1,p2,.3,.2);branch(group,p2,p3,.21,.12);for(let root=0;root<5;root++){const angle=root/5*Math.PI*2+random()*.35,end=new THREE.Vector3(Math.cos(angle)*(1.05+random()*.65),.04,Math.sin(angle)*(1.05+random()*.65));branch(group,new THREE.Vector3(0,.24,0),end,.2,.03)}for(let i=0;i<3;i++){const end=p2.clone().add(new THREE.Vector3(side*(i-1)*1.15,.85+i*.22,(i-1)*.32));branch(group,p2,end,.15,.055);const crownMaterial=new THREE.MeshBasicMaterial({map:crownMaps[(row+i)%crownMaps.length],transparent:true,alphaTest:.018,depthWrite:false,side:THREE.DoubleSide,color:i===2?0xd8d3a1:0xffffff}),crown=new THREE.Mesh(crownGeo,crownMaterial);crown.position.copy(end).add(new THREE.Vector3(0,.55,0));crown.scale.set(.7+random()*.38,.7+random()*.35,1);crown.rotation.z=(random()-.5)*.28;group.add(crown);const cross=crown.clone();cross.rotation.y=Math.PI/2;cross.scale.x*=.72;group.add(cross)}scene.add(group);swaying.push({mesh:group,phase:random()*7,amount:.004+random()*.007})}}
      for(let i=0;i<150;i++){const side=i%2?-1:1,x=side*(1.15+random()*6.2),z=3-random()*108;if(i%12===0){const rock=new THREE.Mesh(rockGeo,mats.rock);rock.position.set(x,.25,z);rock.scale.set(.5+random(),.35+random()*.4,.6+random());rock.rotation.set(random(),random(),random());scene.add(rock)}else{const grass=new THREE.Mesh(grassGeo,mats.grass.clone());grass.position.set(x,.63+random()*.22,z);grass.scale.setScalar(.35+random()*.75);grass.rotation.y=(random()-.5)*.5;scene.add(grass);swaying.push({mesh:grass,phase:random()*8,amount:.02})}}
      const mossGeo=new THREE.DodecahedronGeometry(.52,1);for(let i=0;i<42;i++){const side=i%2?-1:1,x=side*(1.7+random()*7),z=-4-random()*100,stone=new THREE.Mesh(mossGeo,i%3?mats.rock:mats.moss);stone.position.set(x,terrainHeight(x,z)+.25,z);stone.scale.set(.55+random()*1.45,.32+random()*.7,.55+random()*1.25);stone.rotation.set(random()*.3,random()*Math.PI,random()*.2);scene.add(stone)}
      const logGroup=new THREE.Group();scene.add(logGroup);branch(logGroup,new THREE.Vector3(-7,.42,-57),new THREE.Vector3(-3.7,.55,-59),.38,.28);for(let i=0;i<4;i++){const twigStart=new THREE.Vector3(-5.5+i*.45,.5,-58),twigEnd=twigStart.clone().add(new THREE.Vector3((i-1.5)*.35,.45+random()*.35,i%2?.5:-.5));branch(logGroup,twigStart,twigEnd,.08,.025)}
      const waterMat=new THREE.MeshBasicMaterial({color:0x6bb4ad,transparent:true,opacity:.78,side:THREE.DoubleSide}),water=new THREE.Mesh(new THREE.PlaneGeometry(17,3.4),waterMat);water.rotation.x=-Math.PI/2;water.position.set(0,.02,-89);scene.add(water);const bridgeMat=new THREE.MeshToonMaterial({color:0x9a805a,gradientMap:gradient});for(let i=-2;i<=2;i++){const plank=new THREE.Mesh(new THREE.BoxGeometry(.49,.13,3.7),bridgeMat);plank.position.set(i*.5,.24,-89);plank.rotation.y=(i%2)*.025;scene.add(plank)}
      const beamMat=new THREE.MeshBasicMaterial({color:0xfff1b5,transparent:true,opacity:.055,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}),beamGeo=new THREE.CylinderGeometry(.2,2.1,10,10,1,true),beams=[];for(let i=0;i<6;i++){const beam=new THREE.Mesh(beamGeo,beamMat);beam.position.set(i%2?-4:4,4.8,-15-i*17);beam.rotation.z=i%2?-.2:.2;scene.add(beam);beams.push(beam)}
      const motes=[],moteGeo=new THREE.SphereGeometry(.025,5,4),moteMat=new THREE.MeshBasicMaterial({color:0xfff0ad,transparent:true,opacity:.55});for(let i=0;i<34;i++){const mote=new THREE.Mesh(moteGeo,moteMat);mote.position.set(random()*12-6,.6+random()*5,-8-random()*95);scene.add(mote);motes.push({mesh:mote,phase:random()*9})}
      let playing=true,last=performance.now(),travel=Number(progress.value)/1000
      function updateControls(){travel=Number(progress.value)/1000;document.getElementById('percent').textContent=Math.round(travel*100)+'%';document.getElementById('progress-output').textContent=Math.round(travel*100)+'%';const pale=Number(wash.value)/100;renderer.toneMappingExposure=.82+pale*.38;scene.fog.far=61-pale*14;document.getElementById('wash-output').textContent=wash.value+'%';paper.style.opacity=Number(paperRange.value)/100;document.getElementById('paper-output').textContent=paperRange.value+'%';const glow=Number(light.value)/100;beamMat.opacity=.015+glow*.085;moteMat.opacity=.2+glow*.65;document.getElementById('light-output').textContent=light.value+'%'}
      ;[progress,wash,paperRange,light].forEach(input=>input.addEventListener('input',()=>{playing=false;demo.classList.remove('playing');document.getElementById('toggle').textContent='再生';updateControls()}));document.getElementById('toggle').addEventListener('click',()=>{playing=!playing;demo.classList.toggle('playing',playing);document.getElementById('toggle').textContent=playing?'一時停止':'再生'})
      function resize(){const rect=viewport.getBoundingClientRect();renderer.setSize(rect.width,rect.height,false);camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(viewport);resize();updateControls()
      function frame(now){const delta=Math.min((now-last)/1000,.05);last=now;if(playing){travel=(travel+delta*.018)%1;progress.value=String(Math.round(travel*1000));updateControls()}const z=THREE.MathUtils.lerp(5,-97,travel),curve=Math.sin(travel*Math.PI*3)*.42+Math.sin(travel*Math.PI*7)*.1,time=now*.001,step=playing?Math.sin(time*Math.PI*3.85):0;camera.position.set(curve+step*.018,1.55+Math.abs(step)*.024,z);camera.rotation.z=step*.0018;camera.lookAt(curve*.45,1.42+Math.abs(step)*.008,z-11);swaying.forEach(({mesh,phase,amount})=>{mesh.rotation.z+=(Math.sin(time*.85+phase)*amount-mesh.rotation.z)*.025});motes.forEach(({mesh,phase})=>{mesh.position.y+=Math.sin(time+phase)*.0008});renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame)
    }catch(reason){console.error(reason);error.classList.add('show')}
  </script>
</body>
</html>
