function creekRibbon(){const vertices=[],uv=[],indices=[],steps=56;for(let i=0;i<=steps;i++){const x=-38+i/steps*76,center=-138+Math.sin(x*.16)*1.15+Math.sin(x*.055)*.7,half=2.0+.55*Math.sin(x*.23+1.2)+.3*Math.sin(x*.47);for(const side of [-1,1]){const z=center+half*side;vertices.push(x,height(x,z)+.09,z);uv.push(i/steps,side<0?0:1)}if(i<steps){const a=i*2;indices.push(a,a+2,a+1,a+1,a+2,a+3)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(indices);g.computeVertexNormals();return new THREE.Mesh(g,mats.water)}const creek=creekRibbon();creek.renderOrder=1;scene.add(creek);
const bridge=new THREE.Group();for(let i=0;i<8;i++){const plank=new THREE.Mesh(new THREE.BoxGeometry(2.35,.13,.62),mats.wood);plank.position.z=(i-3.5)*.62;plank.castShadow=plank.receiveShadow=true;bridge.add(plank)}for(const x of [-1.05,1.05])for(const z of [-2.25,0,2.25]){const post=new THREE.Mesh(new THREE.CylinderGeometry(.055,.07,1.05,6),mats.wood);post.position.set(x,.5,z);bridge.add(post)}place(bridge,.985,0,.34);

// Low-cost distant cards: the next destination is the star-viewing mountain path.
// The ridgeline is mostly hidden by the forest and reappears beyond the creek bridge.
function mountainCard(color,x,y,z,sx,sy,variant=0){const peaks=variant?[[-1,0],[-.72,.18],[-.48,.42],[-.2,.22],[.08,.62],[.34,.3],[.62,.48],[1,0]]:[[-1,0],[-.7,.22],[-.42,.58],[-.12,.25],[.18,.82],[.45,.4],[.72,.57],[1,0]],shape=new THREE.Shape();shape.moveTo(peaks[0][0],peaks[0][1]);for(let i=1;i<peaks.length;i++)shape.lineTo(peaks[i][0],peaks[i][1]);shape.lineTo(1,-.12);shape.lineTo(-1,-.12);shape.closePath();const m=new THREE.Mesh(new THREE.ShapeGeometry(shape),new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide,fog:true}));m.position.set(x,y,z);m.scale.set(sx,sy,1);scene.add(m)}

const motes=[];const moteGeo=new THREE.SphereGeometry(.035,5,4),moteMat=new THREE.MeshBasicMaterial({color:0xffe7a2,transparent:true,opacity:.52});for(let i=0;i<34;i++){const s=.43+rnd()*.53,p=point(s),r=rightAt(s),m=new THREE.Mesh(moteGeo,moteMat);m.position.copy(p).addScaledVector(r,(rnd()-.5)*8);m.position.y=1+rnd()*5;scene.add(m);motes.push({m,phase:rnd()*9})}

const labels=[[0,'花の草原'],[.2,'林縁手前'],[.4,'森の入口'],[.55,'成木の狭間'],[.75,'光の森内部'],[1,'小川の橋']];
const jumps=document.getElementById('jumps');labels.forEach(([s,label],i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{playing=false;progress=s;sync();document.querySelectorAll('.jumps button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};jumps.appendChild(b)});
let progress=0,playing=false,playMode='preview',sentence=1,last=performance.now(),walkPhase=0;
function nearestLabel(s){let n=0;for(let i=1;i<labels.length;i++)if(Math.abs(labels[i][0]-s)<Math.abs(labels[n][0]-s))n=i;return n}
function sync(){ui.progress.value=Math.round(progress*1000);ui.progressOut.textContent=progress.toFixed(3);ui.paceOut.textContent=(.45+(+ui.pace.value/20)*1.55).toFixed(2);const n=nearestLabel(progress);ui.label.textContent=labels[n][1]+' · s '+progress.toFixed(2);document.querySelector('.paper').style.display=ui.paper.checked?'block':'none'}
ui.play.onclick=()=>{playMode='preview';playing=true};ui.walkPlay.onclick=()=>{playMode='walk';playing=true};ui.pause.onclick=()=>playing=false;ui.reset.onclick=()=>{playing=false;progress=0;walkPhase=0;sync()};ui.progress.oninput=()=>{playing=false;progress=+ui.progress.value/1000;sync()};ui.pace.oninput=sync;ui.paper.onchange=sync;ui.sentence.onclick=()=>{sentence++;ui.sentenceOut.textContent='文 '+sentence+' / s '+progress.toFixed(2)+' を保持'};
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;if(renderer.domElement.width!==Math.round(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}}
function smoothPulse(s,a,b){if(s<=a||s>=b)return 0;const x=(s-a)/(b-a);return Math.sin(x*Math.PI)}
function logStep(s){return -.055*smoothPulse(s,.685,.716)+.43*smoothPulse(s,.708,.765)-.045*smoothPulse(s,.758,.79)}
function logLook(s){return -.22*smoothPulse(s,.665,.724)+.10*smoothPulse(s,.725,.775)}
const meadowTop=new THREE.Color(0x9bcfdf),meadowHorizon=new THREE.Color(0xe9efd8),forestTop=new THREE.Color(0x52786b),forestHorizon=new THREE.Color(0x9bb59a),fogMeadow=new THREE.Color(0xc4dcd2),fogForest=new THREE.Color(0x779485);
function render(now){requestAnimationFrame(render);resize();const dt=Math.min(.05,(now-last)/1000);last=now;const pace=.45+(+ui.pace.value/20)*1.55,walking=playing&&playMode==='walk';if(playing){const logSlow=walking&&progress>.67&&progress<.79?.58:1;progress=Math.min(1,progress+dt/12*logSlow);if(progress===1)playing=false;sync()}if(walking)walkPhase+=dt*(4.4+pace*3.4);const s=progress>.975?.925:Math.min(progress,.975),p=point(s),t=tangent(s),r=rightAt(s),look=point(Math.min(1,s+.045));const motion=ui.reduced.checked?.25:1,foot=Math.sin(walkPhase),vertical=walking?Math.abs(foot)*.052*motion*(.65+.35*pace):0,lateral=walking?foot*.034*motion:0,step=walking?logStep(progress)*(ui.reduced.checked?.18:1):0,baseY=height(p.x,p.z)+1.52+vertical+step;camera.position.set(p.x+r.x*lateral,baseY,p.z+r.z*lateral);camera.up.set(Math.sin(walkPhase*.5)*.012*motion,1,Math.cos(walkPhase*.5)*.006*motion).normalize();camera.lookAt(look.x+r.x*lateral*.25,height(look.x,look.z)+(progress>.975?.42:1.25)+vertical*.35+step*.18+(walking?logLook(progress)*motion:0),look.z+r.z*lateral*.25);sky.position.copy(camera.position);const forestBase=THREE.MathUtils.smoothstep(progress,.22,.68),bridgeOpening=THREE.MathUtils.smoothstep(progress,.88,1),forestMix=forestBase*(1-.36*bridgeOpening);skyUniforms.forestMix.value=forestMix;skyUniforms.topColor.value.copy(meadowTop).lerp(forestTop,forestMix);skyUniforms.horizonColor.value.copy(meadowHorizon).lerp(forestHorizon,forestMix);scene.fog.color.copy(fogMeadow).lerp(fogForest,forestMix);scene.fog.density=THREE.MathUtils.lerp(.0085,.024,forestMix);hemi.intensity=THREE.MathUtils.lerp(2.0,1.22,forestMix);sun.intensity=THREE.MathUtils.lerp(3.1,1.85,forestMix);renderer.toneMappingExposure=THREE.MathUtils.lerp(1.06,.91,forestMix);motes.forEach(({m,phase},i)=>{m.visible=ui.motes.checked;m.position.y+=Math.sin(now*.0012+phase+i)*.00035});renderer.render(scene,camera)}
sync();requestAnimationFrame(render);
